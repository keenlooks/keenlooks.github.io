name: Update Claude Context and Worker

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Read-only token; the Cloudflare secrets are the only credentials this job needs.
permissions:
  contents: read

# One deploy at a time, in push order: a second push waits for the first to finish
# instead of racing it (an older run finishing last would deploy the older prompt).
concurrency:
  group: update-claude-context
  cancel-in-progress: false

jobs:
  update-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned versions (content_extractor.py needs Python 3.12+); bump deliberately.
      - name: Install dependencies
        run: |
          pip install pypdf==6.21.4 python-frontmatter==1.3.0 pyyaml==6.0.3

      - name: Generate context
        run: python content_extractor.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned (4.154.0 deployed this Worker on 2026-10-27); bump deliberately.
      - name: Install Wrangler
        run: |
          npm install -g wrangler@4.154.0
          wrangler --version

      - name: Configure Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Create wrangler.toml with direct configuration
          cat << EOF > wrangler.toml
          name = "flat-bread-e3e2"
          main = "worker.js"
          compatibility_date = "2024-03-26"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          workers_dev = true

          [vars]
          ENVIRONMENT = "production"
          EOF

          # Set environment variables for Wrangler
          export CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
          export CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
          
          # Verify configuration
          echo "Testing Wrangler configuration..."
          wrangler whoami || true
          
      - name: Update and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Export environment variables again for this step
          export CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
          export CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
          
          echo "Deploying worker..."
          python update_worker.py
